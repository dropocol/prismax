<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="xterm.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1b1b1c;
      overflow: hidden;
    }
    #terminal {
      height: 100vh;
      padding: 8px 4px;
      box-sizing: border-box;
    }
    /* xterm fills its container */
    .xterm {
      height: 100%;
    }
    .xterm-viewport {
      background-color: transparent !important;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontFamily: 'Menlo, Monaco, "Courier New", monospace',
      fontSize: 13,
      lineHeight: 1.2,
      allowProposedApi: true,
      scrollback: 5000,
      theme: {
        background: '#1b1b1c',
        foreground: '#e8e8e8',
        cursor: '#e8e8e8',
        selectionBackground: '#5b5ecc55'
      }
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    // Bridge: Swift injects PTY output via this global function.
    window.writeToTerminal = function(base64) {
      const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      term.write(bytes);
    };

    // Keystrokes → Swift. Use postMessage via a custom URL scheme handler.
    term.onData(data => {
      // Encode as base64 to survive the bridge intact.
      const base64 = btoa(unescape(encodeURIComponent(data)));
      window.webkit.messageHandlers.terminalInput.postMessage(base64);
    });

    // Report size changes → Swift (sets the PTY window size).
    function reportSize() {
      const cols = term.cols;
      const rows = term.rows;
      window.webkit.messageHandlers.terminalResize.postMessage({ cols: cols, rows: rows });
    }
    term.onResize(reportSize);
    reportSize();

    // Resize observer for the container.
    const ro = new ResizeObserver(() => {
      try { fitAddon.fit(); } catch (e) {}
    });
    ro.observe(document.getElementById('terminal'));

    // Focus the terminal on click/ready.
    term.focus();
    window.focusTerminal = function() { term.focus(); };

    // Clear the terminal: drops the scrollback buffer above the current prompt
    // but keeps the prompt line (so the user still sees `➜ dir git:(branch)`
    // and can keep typing). This mirrors what the `clear` command does, but
    // without typing/echoing anything into the shell. Called by Swift when the
    // user hits the "clear" toolbar button.
    window.clearTerminal = function() {
      if (typeof term.clear === 'function') {
        term.clear();
      } else {
        term.reset();
      }
    };
  </script>
</body>
</html>
